# =======================================================================================
# Qwen3-32B GPTQ + Erry Output-Norm Clip + Selective Rotation Calibration Recipe
# Consumed programmatically via quant.build_gptq_pass_args() to build optimization passes.
# =======================================================================================

[gptq]
model_name      = "Qwen/Qwen3-32B"
dataset         = "wikitext2"         # Default. Same-task runs override to "file:<ifeval_calib>.pt"
nsamples        = 128                 # Total calibration segments
seqlen          = 2048                # Token window per sample
format          = "mxint"             # Targeted microscaling integer format
quantile_search = true                # Fast static weight clipping (always active)
clip_search_y   = false               # Base GPTQ is false. Flip to true for "+Erry Clip" activation pass
cali_batch_size = 8                   # Footprint configuration. Reduce if experiencing calibration OOM

[gptq.weight_config]
weight_block_size = 32                # Target MX block size granularity
weight_width      = 4                 # Target quantization bit-width

[rotation_search]
calib_nsamples  = 128                 # Rotation matrix data volume
calib_seqlen    = 2048                # Rotation matrix sequence length
improvement_eps = 0.0                 # Minimum loss reduction threshold to commit a rotation
matmul_types    = [                   # Targeted layers for online coordinate transformations
  "q_proj", "k_proj", "v_proj", "o_proj",
  "up_proj", "gate_proj", "down_proj",
  "kv_cache"
]