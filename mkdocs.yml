site_name: PLENA Software — Quantization Evaluation Toolkit
site_description: Evaluate MX-quantized LLMs with perplexity and lm-eval harness benchmarks.
site_url: https://aicrosssim.github.io/PLENA_Software/
repo_url: https://github.com/AICrossSim/PLENA_Software
repo_name: AICrossSim/PLENA_Software
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - attr_list
  - def_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            # Use static (griffe) analysis only — CI doesn't need torch/mase
            # imported to render docstrings; just parse the source files.
            allow_inspection: false

nav:
  - Welcome: index.md
  - Get started: getting-started.md
  - Evaluation commands: reference/cli.md
  - Quantization configs: reference/toml-reference.md
