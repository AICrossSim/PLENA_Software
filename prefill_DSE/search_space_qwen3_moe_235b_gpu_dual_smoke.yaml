# High-VRAM Qwen3-235B-A22B smoke configuration.
#
# This is intentionally separate from the 30B-A3B config.  It keeps GPTQ in
# memory and keeps FP decode weights resident on GPU, so it should only be used
# on large multi-GPU machines.
model:
  model_name: /data/models/pgf23_cache/hub/models--Qwen--Qwen3-235B-A22B-Instruct-2507/snapshots/ac9c66cc9b46af7306746a9250f23d47083d689e
  model_family: qwen3_moe
  bfcl_model_alias: Qwen/Qwen3-235B-A22B-Instruct-2507-FC
  bfcl_adapter: qwen3_fc
  dtype: bfloat16
  quant_config: quant_eval/configs/qwen3_moe_mxint16.toml

bfcl:
  test_categories: multiple
  tool_mode: return
  num_threads: 1
  max_new_tokens: 256
  limit: 5

gptq:
  dataset: calib/qwen3_moe_30b_a3b_bfcl_official_wrapped_s1024_n32.pt
  nsamples: 32
  seqlen: 1024
  format: mxint
  weight_width: 16
  weight_block_size: 32
  cali_batch_size: 1
  max_layers: null
  device_map_aware: true
  cache_dir: prefill_DSE/gptq_cache_qwen3_moe_235b
  cache_mode: memory

runtime:
  parallel_mode: pp
  model_lifecycle: persistent
  decode_weight_mode: fp
  decode_weight_residency: gpu_dual
  gpu_memory_reserve_mb: 0
  gpu_memory_reserve_disable: true
  gpu_memory_reserve_wait_sec: 600
  gpu_memory_reserve_poll_sec: 5.0
  gpu_memory_reserve_chunk_mb: 512
  trial_timeout_sec: 7200
  bfcl_project_root: .bfcl
  bfcl_env_bin: .conda/envs/plena-bfcl/bin

search_space:
  ACT:
    - MXINT_8
  KV:
    - MXINT_8
  FP_SETTING:
    - FP_E8M5
