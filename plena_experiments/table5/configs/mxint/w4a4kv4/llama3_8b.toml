# Table 5 — LLaMA-3-8B, W/A/KV = 4/4/4 — MXInt with GPTQ + y-clip + selective rotation
#
# What's quantized
#   • Weights of all 7 linear GEMMs (q/k/v/o + gate/up/down): MXInt4, block=16,
#     via GPTQ + activation-aware (y-norm) clip search.
#   • Input activations of those 7 linears: MXInt4, block=16.
#   • Attention internals (qk_matmul, av_matmul, kv_cache): MXInt4, block=16.
#   • softmax / rope: bypassed (kept in fp).
#
# What [rotation_search] does
#   On first run, greedy-forward-searches the 10 matmul types using a wikitext2
#   calibration loader and commits the subset of online Hadamard rotations that
#   strictly improves perplexity. The winning decisions cache to
#     <gptq.checkpoint_dir>/rotation_decisions.json
#   (mirrors GPTQ's auto-resume). Subsequent runs skip the search and just apply
#   the saved winners. Delete that JSON to force a re-search.
#
# Calibration
#   GPTQ + rotation search both use wikitext2 to match the rest of Table 5.
#   PPL eval (in eval_ppl.py) runs on wikitext.

by = "regex_name"

[gptq]
model_name      = "meta-llama/Meta-Llama-3-8B"
dataset         = "wikitext2"
nsamples        = 128
seqlen          = 2048
format          = "mxint"
quantile_search = true
clip_search_y   = true
cali_batch_size = 32
checkpoint_dir  = "checkpoints/table5/llama3_8b_mxint_w4a16kv16"

[gptq.weight_config]
weight_block_size = 16
weight_width      = 4

[rotation_search]
# calib_data defaults to [gptq].dataset (wikitext2); uncomment to override.
# calib_data    = "wikitext2"
calib_nsamples  = 128
calib_seqlen    = 2048
improvement_eps = 0.0     # require strict ppl drop to commit
matmul_types    = ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "gate_proj", "down_proj", "kv_cache"]
# Reusing the w4a16kv16 weight checkpoint above; redirect rotation cache so
# we don't write rotation_decisions.json into that shared dir.
cache_path      = "checkpoints/table5/llama3_8b_mxint_w4a4kv4/rotation_decisions.json"
# matmul_types defaults to the full set:
# matmul_types   = ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "gate_proj", "down_proj", "kv_cache"]

# Attention block — keep "mxint"; the search auto-promotes to "mxint_rotate"
# with all rotation flags off, then flips winners on.
['model\.layers\.\d+\.self_attn$']
name = "mxint"

['model\.layers\.\d+\.self_attn$'.qk_matmul]
bypass = true

['model\.layers\.\d+\.self_attn$'.av_matmul]
bypass = true

['model\.layers\.\d+\.self_attn$'.kv_cache]
data_in_block_size = 16
data_in_width      = 4

['model\.layers\.\d+\.self_attn$'.softmax]
bypass = true

['model\.layers\.\d+\.self_attn$'.rope]
bypass = true

['model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true

['model\.layers\.\d+\.mlp\.(gate|up|down)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true
