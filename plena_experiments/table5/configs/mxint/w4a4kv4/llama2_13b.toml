# Table 5 — LLaMA-2-13B, W/A/KV = 4/4/4 — MXInt with GPTQ + y-clip + selective rotation
# w4a16kv16 checkpoint for this model still running; uses its own checkpoint dir.

by = "regex_name"

[gptq]
model_name      = "meta-llama/Llama-2-13b-hf"
dataset         = "wikitext2"
nsamples        = 128
seqlen          = 2048
format          = "mxint"
quantile_search = true
clip_search_y   = true
cali_batch_size = 32
checkpoint_dir  = "checkpoints/table5/llama2_13b_mxint_w4a16kv16"

[gptq.weight_config]
weight_block_size = 16
weight_width      = 4

[rotation_search]
calib_nsamples  = 32
calib_seqlen    = 2048
improvement_eps = 0.0
matmul_types    = ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "gate_proj", "down_proj", "kv_cache"]
cache_path      = "checkpoints/table5/llama2_13b_mxint_w4a4kv4/rotation_decisions.json"

['model\.layers\.\d+\.self_attn$']
name = "mxint"

['model\.layers\.\d+\.self_attn$'.qk_matmul]
bypass = true

['model\.layers\.\d+\.self_attn$'.av_matmul]
bypass = true

['model\.layers\.\d+\.self_attn$'.kv_cache]
data_in_block_size = 16
data_in_width      = 4

['model\.layers\.\d+\.self_attn$'.softmax]
bypass = true

['model\.layers\.\d+\.self_attn$'.rope]
bypass = true

['model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true

['model\.layers\.\d+\.mlp\.(gate|up|down)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true
