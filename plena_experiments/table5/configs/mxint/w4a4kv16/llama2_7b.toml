# Table 6 — LLaMA-2-7B, W/A/KV = 4/4/16 — MXInt with GPTQ + y-clip + selective rotation
#
# All 9 GEMMs in scope (7 linears + qk_matmul + av_matmul):
#   • Weights of 7 linears (q/k/v/o + gate/up/down): MXInt4, block=16,
#     via GPTQ + activation-aware (y-norm) clip search.
#   • Input activations of 7 linears: MXInt4, block=16.
#   • Attention internals qk_matmul, av_matmul: MXInt4, block=16.
#   • KV cache: NOT quantized (kept fp16 — this is the "kv16" of W4A4KV16).
#   • softmax / rope: bypassed.
#
# [rotation_search] performs greedy-forward selection over the 10 matmul types;
# winners cache to <gptq.checkpoint_dir>/rotation_decisions.json.

by = "regex_name"

[gptq]
model_name      = "meta-llama/Llama-2-7b-hf"
dataset         = "wikitext2"
nsamples        = 128
seqlen          = 2048
format          = "mxint"
quantile_search = true
clip_search_y   = true
cali_batch_size = 32
checkpoint_dir  = "checkpoints/table5/llama2_7b_mxint_w4a16kv16"

[gptq.weight_config]
weight_block_size = 16
weight_width      = 4

[rotation_search]
calib_nsamples  = 128
calib_seqlen    = 2048
improvement_eps = 0.0
matmul_types    = ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "gate_proj", "down_proj"]
# Reusing the w4a16kv16 weight checkpoint above; redirect rotation cache so
# we don't write rotation_decisions.json into that shared dir.
cache_path      = "checkpoints/table5/llama2_7b_mxint_w4a4kv16/rotation_decisions.json"

# Stock attention (W4A4KV16: KV stays fp16, qk/av stay fp16).

['model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true

['model\.layers\.\d+\.mlp\.(gate|up|down)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true
