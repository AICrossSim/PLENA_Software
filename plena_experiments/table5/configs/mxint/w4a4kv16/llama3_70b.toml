# Table 5 — LLaMA-3-70B, W/A/KV = 4/4/16 — MXInt with GPTQ + y-clip + selective rotation
# Reuses the GPTQ checkpoint from the w4a16kv16 config (same weight recipe).
# Rotation decisions cached per-config under cache_path.

by = "regex_name"

[gptq]
model_name      = "meta-llama/Meta-Llama-3-70B"
dataset         = "wikitext2"
nsamples        = 128
seqlen          = 2048
format          = "mxint"
quantile_search = true
clip_search_y   = true
cali_batch_size = 32
checkpoint_dir  = "checkpoints/table5/llama3_70b_mxint_w4a16kv16"

[gptq.weight_config]
weight_block_size = 16
weight_width      = 4

[rotation_search]
calib_nsamples  = 128
calib_seqlen    = 2048
improvement_eps = 0.0
matmul_types    = ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "gate_proj", "down_proj"]
cache_path      = "checkpoints/table5/llama3_70b_mxint_w4a4kv16/rotation_decisions.json"

['model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true

['model\.layers\.\d+\.mlp\.(gate|up|down)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true
