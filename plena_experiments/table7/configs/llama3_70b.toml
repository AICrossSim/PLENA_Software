# Table 7 — LLaMA-3-70B downstream task evaluation (lm-eval-harness)
# W/A/KV = 4/4/4 MXInt with GPTQ + y-clip + selective rotation.
#
# Reuses the GPTQ checkpoint and cached rotation_decisions from the
# Table 5 w4a4kv4 run — no fresh rotation search is performed; the
# committed rotations are applied during downstream evaluation.

by = "regex_name"

[gptq]
model_name      = "meta-llama/Meta-Llama-3-70B"
dataset         = "wikitext2"
nsamples        = 128
seqlen          = 2048
format          = "mxint"
quantile_search = true
clip_search_y   = true
cali_batch_size = 32
checkpoint_dir  = "checkpoints/table5/llama3_70b_mxint_w4a16kv16"

[gptq.weight_config]
weight_block_size = 16
weight_width      = 4

[rotation_search]
calib_nsamples  = 32
calib_seqlen    = 2048
improvement_eps = 0.0
matmul_types    = ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "gate_proj", "down_proj", "kv_cache"]
# Reuse cached rotation decisions from the original Table 5 run (no re-search).
cache_path      = "checkpoints/table5/llama3_70b_mxint_w4a4kv4/rotation_decisions.json"

['model\.layers\.\d+\.self_attn$']
name = "mxint"

['model\.layers\.\d+\.self_attn$'.qk_matmul]
bypass = true

['model\.layers\.\d+\.self_attn$'.av_matmul]
bypass = true

['model\.layers\.\d+\.self_attn$'.kv_cache]
data_in_block_size = 16
data_in_width      = 4

['model\.layers\.\d+\.self_attn$'.softmax]
bypass = true

['model\.layers\.\d+\.self_attn$'.rope]
bypass = true

['model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true

['model\.layers\.\d+\.mlp\.(gate|up|down)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true
