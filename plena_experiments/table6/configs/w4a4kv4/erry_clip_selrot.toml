# Table 6 — MXINT Full System — GPTQ + Err_y Clip + Selective Rotation (BEST)
# Everything quantized: weights of 7 linears (GPTQ + Err_y clip) + activations of
# all 9 GEMMs + KV cache + selective Hadamard rotation on the winning matmul subset.
# Expected PPL on Llama-3-8B (wikitext): 7.22  (matches Table 5 4/4/4 PLENA(ours))

by = "regex_name"

[gptq]
model_name      = "meta-llama/Meta-Llama-3-8B"
dataset         = "wikitext2"
nsamples        = 128
seqlen          = 2048
format          = "mxint"
quantile_search = true
clip_search_y   = true
cali_batch_size = 32
checkpoint_dir  = "checkpoints/table5/llama3_8b_mxint_w4a16kv16"

[gptq.weight_config]
weight_block_size = 16
weight_width      = 4

[rotation_search]
calib_nsamples  = 32
calib_seqlen    = 2048
improvement_eps = 0.0
# rotation_decisions.json caches alongside the GPTQ layer files.

['model\.layers\.\d+\.self_attn$']
name = "mxint"

['model\.layers\.\d+\.self_attn$'.qk_matmul]
data_in_block_size = 16
data_in_width      = 4

['model\.layers\.\d+\.self_attn$'.av_matmul]
data_in_block_size = 16
data_in_width      = 4

['model\.layers\.\d+\.self_attn$'.kv_cache]
data_in_block_size = 16
data_in_width      = 4

['model\.layers\.\d+\.self_attn$'.softmax]
bypass = true

['model\.layers\.\d+\.self_attn$'.rope]
bypass = true

['model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true

['model\.layers\.\d+\.mlp\.(gate|up|down)_proj']
name               = "mxint"
weight_block_size  = 16
weight_width       = 4
data_in_block_size = 16
data_in_width      = 4
gptq               = true
