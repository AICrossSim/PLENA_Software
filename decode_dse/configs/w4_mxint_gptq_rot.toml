by = "regex_name"

[gptq]
model_name      = "unsloth/Llama-3.2-1B"
dataset         = "wikitext2"
nsamples        = 128
seqlen          = 2048
format          = "mxint"
quantile_search = true
clip_search_y   = true
cali_batch_size = 32
checkpoint_dir  = "decode_dse/checkpoints/w4_mxint_gptq_rot"

[gptq.weight_config]
weight_block_size = 32
weight_width      = 4

[rotation_search]
calib_nsamples  = 128
calib_seqlen    = 2048
improvement_eps = 0.0
matmul_types    = ["q_proj", "k_proj", "v_proj", "o_proj",
                   "up_proj", "gate_proj", "down_proj",
                   "kv_cache"]
cache_path      = "decode_dse/checkpoints/w4_mxint_gptq_rot/rotation_decisions.json"

['model\.layers\.\d+\.self_attn$']
name = "mxint"

['model\.layers\.\d+\.self_attn$'.qk_matmul]
data_in_block_size = 32
data_in_width      = 8

['model\.layers\.\d+\.self_attn$'.av_matmul]
data_in_block_size = 32
data_in_width      = 8

['model\.layers\.\d+\.self_attn$'.kv_cache]
data_in_block_size = 32
data_in_width      = 8

['model\.layers\.\d+\.self_attn$'.softmax]
bypass = true

['model\.layers\.\d+\.self_attn$'.rope]
bypass = true

['model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj']
name               = "mxint"
weight_block_size  = 32
weight_width       = 4
data_in_block_size = 32
data_in_width      = 8
gptq               = true

['model\.layers\.\d+\.mlp\.(gate|up|down)_proj']
name               = "mxint"
weight_block_size  = 32
weight_width       = 4
data_in_block_size = 32
data_in_width      = 8
gptq               = true
