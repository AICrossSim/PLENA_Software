# LLaMA MXInt8 (W8A8): attention + MLP projections
#
# Every block below uses 8-bit weights and 8-bit activations with a
# block size of 32 (MXInt8). Attention projections also quantise the
# bias to 8 bits.

by = "regex_name"

# --- Attention projections ---
["model\\.layers\\.\\d+\\.self_attn\\.(q|k|v|o)_proj"]
name = "mxint"
weight_block_size = 32
weight_width = 8
data_in_block_size = 32
data_in_width = 8
bias_block_size = 32
bias_width = 8

# --- MLP projections ---
["model\\.layers\\.\\d+\\.mlp\\.(gate|up|down)_proj"]
name = "mxint"
weight_block_size = 32
weight_width = 8
data_in_block_size = 32
data_in_width = 8
