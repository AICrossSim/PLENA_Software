# Qwen3-MoE mixed precision seed config.
#
# Sparse expert GPTQ is handled inside MASE for mlp.experts.*.  This TOML only
# selects ordinary attention projections and any dense Qwen3MoeMLP projections.
# Router/gate modules intentionally remain FP.

by = "regex_name"

# --- Attention projections ---
["model\\.layers\\.\\d+\\.self_attn\\.(q|k|v|o)_proj"]
name = "mxint"
weight_block_size = 32
weight_width = 16
data_in_block_size = 32
data_in_width = 16

# --- Dense MLP projections, if a Qwen3-MoE checkpoint contains dense layers ---
["model\\.layers\\.\\d+\\.mlp\\.(gate|up|down)_proj"]
name = "mxint"
weight_block_size = 32
weight_width = 16
data_in_block_size = 32
data_in_width = 16
